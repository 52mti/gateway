services:
  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kong:
    image: kong:3.9
    container_name: gateway-kong
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      KONG_NORMAL_RATE_LIMIT_PER_MINUTE: ${KONG_NORMAL_RATE_LIMIT_PER_MINUTE:-60}
      UPSTREAM_URL: ${UPSTREAM_URL:-http://host.docker.internal:18000}
      KONG_REDIS_HOST: redis
      KONG_REDIS_PORT: "6379"
      KONG_DATABASE: "off"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - "${KONG_PROXY_PORT:-8000}:8000"
      - "${KONG_ADMIN_PORT:-8001}:8001"
    volumes:
      - ./kong/kong.yml.template:/kong/kong.yml.template:ro
      - ./scripts/kong-entrypoint.sh:/kong-entrypoint.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - sed 's/\r$//' /kong-entrypoint.sh > /tmp/kong-entrypoint.sh && exec /bin/sh /tmp/kong-entrypoint.sh
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
